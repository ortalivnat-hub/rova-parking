plugins {
    id 'com.android.application'
}

android {
    namespace 'il.rova.parking'
    compileSdk 34

    defaultConfig {
        applicationId 'il.rova.parking'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fixed key so the phone accepts the app and future updates install over it.
    signingConfigs {
        release {
            storeFile file('rova-release.jks')
            storePassword 'rovaparking'
            keyAlias 'rova'
            keyPassword 'rovaparking'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
