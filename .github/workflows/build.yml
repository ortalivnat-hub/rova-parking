name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on the runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK (signature and manifest)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          $BT/aapt2 dump badging app/build/outputs/apk/release/app-release.apk | head -20

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk rova-parking.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: חניה ברובע - גרסה אחרונה
          body: להורדה בטלפון - rova-parking.apk
          files: rova-parking.apk
          make_latest: true
